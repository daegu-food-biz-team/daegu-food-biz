function cafePanel(){const r=founders[stats.unit];if(!r)return '<div class="note">자료 미제공</div>';

return `<div class="map-title">업종 분석</div><div class="map-sub">카페·디저트 / 실제 개업 후 2년 생존율</div><div class="detail-panel"><div class="detail-overline">${safe(r.gu)}</div><div class="detail-title">${safe(r.dong)}</div><div class="detail-meta">대구광역시 ${safe(r.gu)} · 카페·디저트</div><div class="metric-row"><div><span>개업 후 2년 생존율 · 보정값</span><div class="metric-big" style="color:#1F4FB8">${pct(r.surv2_adj)}</div></div></div><div class="metric-row"><div><span>관찰 표본</span><br><strong>${r.cohort_n}개</strong></div><div><span>2025년 영업 중</span><br><strong>${r.active_2025}개</strong></div></div><div class="metric-row"><div><span>2022년 영업 중</span><br><strong>${r.active_2022}개</strong></div><div><span>대구 참고 평균</span><br><strong>66.4%</strong></div></div>${r.small_sample?'<div class="warning">표본 20건 미만 · 생존율 보정값 해석 주의</div>':''}</div><div class="section-title">ANNUAL MOVEMENT · 2016–2025</div><div class="body-note" style="margin-bottom:8px"><i class="swatch" style="background:#287A58"></i>개업 &nbsp;&nbsp;<i class="swatch" style="background:#B65359"></i>폐업</div><div class="chart">${yrs.map(y=>`<div class="chart-year"><div class="bar-group"><span class="bar" style="background:#287A58;height:${r['open_'+y]/max*140}px" title="${y} 개업 ${r['open_'+y]}건"></span><span class="bar" style="background:#B65359;height:${r['close_'+y]/max*140}px" title="${y} 폐업 ${r['close_'+y]}건"></span></div><div class="year">${y}</div></div>`).join('')}</div><div class="body-note" style="margin-top:15px">임대료·유동인구·매출은 포함되지 않고, 과거 기록이 개별 점포의 성공을 예측하지 않습니다.</div>`}
function pageBody(){if(stats.page==='home')return landing();if(stats.page==='officer'){return `${nav()}${pageLead('01','동별 병목 진단','7개 구 정체 동 65곳의 병목 진단 · 144개 지역의 과거 현황 조회')}${selectors(true)}<div class="page-grid"><div>${geoMap('officer')}</div><div id="regionDetail">${officerPanel()}</div></div><div class="body-note">과거 병목 유형 적중률 70%. 단순 폐업률 규칙보다 우월하다는 근거는 없으며 지원 우선순위는 별도 현황을 보고 판단합니다.</div>`}
if(stats.page==='founder'){
 const categories=[['cafe','카페·디저트 분석'],['korean','한식'],['pub','주점·호프'],['snack','분식'],['fastfood','패스트푸드'],['asian','중식·일식']];
 const buttons=categories.map(([id,label])=>`<button data-fmode="${id}" class="${stats.founderMode===id?'selected':''}">${label}</button>`).join('');
 const content=stats.founderMode==='cafe'
   ?`${selectors()}<div class="page-grid"><div>${geoMap('founder')}</div><div id="regionDetail">${cafePanel()}</div></div>`
   :`<div class="warning">${safe(founderModeName())} 업종 분석 데이터는 아직 제공되지 않았습니다. 데이터 수령 후 연결할 예정입니다.</div>`;
 return `${nav()}${pageLead('02','업종별 동 분석',founderLeadText(),true)}<div class="controls">${buttons}</div>${content}`;
}
if(stats.page==='report'){const r=off[stats.unit];const ex=support[stats.unit];if(!r.diagnosis_scope.startsWith('진단'))return `${nav()}<div class="warning">이 지역은 병목 진단 대상이 아니며 과거 현황만 제공됩니다.</div>`;
const status=`${stats.unit} · 2025년 말\n\n01 / 진단\n${r.bottleneck}, 확신도 ${r.confidence}, 과거 동일 구간 적중률 ${(100*r.val_accuracy).toFixed(0)}%. 대구 정체 동 65곳과 비교한 상대 평가.\n단순 규칙과 ${r.rule_agree?'일치':'불일치 — 현장 확인 우선'}.\n\n02 / 현황\n영업 중 점포 ${r.n_active}곳. 최근 3년 점포 증감 ${pct(r.growth_past3,true)}. 개업 건수/현재 점포 수 ${pct(r.open_rate)}, 폐업 건수/현재 점포 수 ${pct(r.close_rate)}, 인구 증감 ${pct(r.pop3,true)}.\n\n03 / 주요 요인\n${r.reasons}\n\n04 / 먼저 검토할 지원 유형\n${ex&&ex.policy_types.length?ex.policy_types.join(' · '):'[연결 예정] 팀 정책 유형 미수신'}\n[연결 예정] 지원사업 DB 연결 후 표시\n\n05 / 현장 조사\n${r.bottleneck==='진입 병목'?'[필수] 실무 담당자의 현장 조사가 반드시 필요합니다. 신규 진입이 적은 이유가 기존 점포가 안정적으로 유지되기 때문인지, 상권 침체 때문인지 모델만으로 구별할 수 없습니다. 공실·임대료·업종 구성·현장 수요 확인 후 정책을 검토합니다. 지원사업 데이터 유무와 관계없이 현장 조사는 필수입니다.':'현장 점검을 통해 실제 생존 여건과 해당 지역의 업종 특성을 확인해야 합니다.'}\n\n06 / 한계\n인허가 자료 기반 외식 점포 생태계 분석입니다. 매출 예측이 아니며 지원 우선순위, 개별 점포 성공 확률, 정책 효과를 판단하지 않습니다.`;
return `${nav()}${pageLead('03','동별 진단 리포트','입력 자료 밖의 숫자나 사업명은 만들지 않습니다.')}<div class="report"><div class="detail-overline">DAEGU FOOD BIZ · V2 REPORT / 미리보기 (LLM 미호출)</div><h2>${safe(stats.unit)}</h2><p>${safe(status)}</p></div><div class="warning">HTML 미리보기에서는 LLM API·PostgreSQL·실제 지원사업 조회가 동작하지 않습니다. 정식 앱에서 연결할 수 있습니다.</div><div class="report-actions"><button data-page="officer">← 담당자용 지도로</button><button id="reportPrint" onclick="window.print()">보고서 인쇄 / PDF로 저장</button></div>`}return '';}
function sourceFooter(){
 if(!['officer','founder'].includes(stats.page))return '';
 return `<details class="source-footer"><summary>자료 출처 · 데이터 상태</summary><div class="source-body">
 기준: 2025년 말 · 7개 구 130개 법정동, 달성군 9개 읍·면, 군위군 5개 읍·면 (총 144개 지역)<br>
 병목 진단: 정체 동 65곳(진입 31곳 / 생존 34곳) · 읍·면은 과거 현황만 제공<br>
 지도: 법정동·읍면 경계 212개(공식 주소정보누리집 2026-11판) 중 분석 자료가 있는 144개 지역을 색상 진단합니다. 나머지 68개 지역은 분석 자료 없음으로 표시합니다.<br>
 데이터: 조원 제공 인허가·인구 분석 결과 및 2025년 기준 모델 v2 결과<br>
 모델의 병목 유형 과거 적중률 약 70%. 개별 상권 성공률·매출 예측·정책 우선순위가 아닙니다.
 </div></details>`;
}
function render(){document.body.classList.toggle('first-entry',stats.page==='home'&&stats.firstHome);document.getElementById('app').innerHTML=header()+pageBody()+sourceFooter()+'<div class="footer-spacer"></div>';wire();if(stats.page==='home')stats.firstHome=false;}
/* Update just the side panel and selection styling; never rebuild/reload the map. */
function chooseUnit(u){
 if(!off[u])return;
 stats.unit=u;
 const drop=document.getElementById('unitChoice');
 if(drop&&[...drop.options].some(x=>x.value===u))drop.value=u;
 const region=document.getElementById('regionDetail');
 if(region){
   region.innerHTML=stats.page==='founder'?cafePanel():officerPanel();
   region.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{stats.hover=null;pageGo(el.dataset.page)}));
 }
 const active=featuresForGu().find(({ft})=>ft.properties.UNIT===u)?.ft.properties;
 const panel=document.getElementById('mapInfo');
 if(panel)panel.innerHTML=mapInfo(active,stats.page==='founder'?'founder':'officer');
 document.querySelectorAll('#mapSvg path[data-geo]').forEach(el=>{
   const f=DATA.geo.features[Number(el.dataset.geo)];
   el.classList.toggle('is-selected',!!f&&f.properties.UNIT===u);
 });
}

function wire(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{stats.hover=null;pageGo(el.dataset.page)}));document.querySelectorAll('[data-fmode]').forEach(el=>el.addEventListener('click',()=>{stats.founderMode=el.dataset.fmode;render()}));
let gu=document.getElementById('guChoice');if(gu)gu.onchange=()=>{stats.gu=gu.value;stats.zoom=1;stats.panX=0;stats.panY=0;render()};let unit=document.getElementById('unitChoice');if(unit)unit.onchange=()=>{chooseUnit(unit.value)};let layer=document.getElementById('layerChoice');if(layer)layer.onchange=()=>{stats.layer=layer.value;render()};
if(document.getElementById('mapSvg'))wireMap();}
function wireMap(){
 const svg=document.getElementById('mapSvg'),group=document.getElementById('shapeGroup'),panel=document.getElementById('mapInfo');
 const scene=stats.frame,cx=scene.x+scene.w/2,cy=scene.y+scene.h/2;
 let down=false,move=false,prev=null,downPath=null;
 const transform=()=>group.setAttribute('transform',groupTransform());
 const clamp=()=>{const z=stats.zoom;let dx=(z-1)*scene.w/2,dy=(z-1)*scene.h/2;
   stats.panX=Math.max(-dx,Math.min(dx,stats.panX));stats.panY=Math.max(-dy,Math.min(dy,stats.panY));};
 const cursor=ev=>{let pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());};
 const zoomAt=(target,x=cx,y=cy)=>{let next=Math.max(1,Math.min(4.5,target)),ratio=next/stats.zoom;
   if(Math.abs(next-stats.zoom)<1e-6)return;
   stats.panX=(x-cx)-ratio*(x-cx-stats.panX);
   stats.panY=(y-cy)-ratio*(y-cy-stats.panY);
   stats.zoom=next;clamp();transform();};
 const findp=ev=>{let path=ev.target.closest('path[data-geo]');return path?DATA.geo.features[Number(path.dataset.geo)].properties:null};
 svg.addEventListener('pointermove',ev=>{if(down){const pos=cursor(ev);
   if(prev){const dx=pos.x-prev.x,dy=pos.y-prev.y;if(Math.abs(dx)+Math.abs(dy)>.01){stats.panX+=dx;stats.panY+=dy;clamp();transform();move=true;}}
   prev=pos;
 }else{let p=findp(ev);if(p)panel.innerHTML=mapInfo(p,stats.page==='founder'?'founder':'officer');}});
 svg.addEventListener('pointerleave',()=>{if(!down){let selected=featuresForGu().find(({ft})=>ft.properties.UNIT===stats.unit)?.ft.properties;panel.innerHTML=mapInfo(selected,stats.page==='founder'?'founder':'officer');}});
 svg.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;down=true;move=false;downPath=ev.target.closest('path[data-geo]');prev=cursor(ev);svg.setPointerCapture(ev.pointerId);svg.classList.add('dragging');});
 svg.addEventListener('pointerup',ev=>{if(!down)return;down=false;svg.classList.remove('dragging');
   if(!move){let p=downPath?DATA.geo.features[Number(downPath.dataset.geo)].properties:findp(ev);if(p&&p.UNIT&&off[p.UNIT]){chooseUnit(p.UNIT);}}});
 svg.addEventListener('pointercancel',()=>{down=false;svg.classList.remove('dragging');});
 svg.addEventListener('wheel',ev=>{ev.preventDefault();let p=cursor(ev);zoomAt(stats.zoom*(ev.deltaY<0?1.14:1/1.14),p.x,p.y);},{passive:false});
 document.getElementById('mapZoomIn').onclick=()=>zoomAt(stats.zoom*1.35);
 document.getElementById('mapZoomOut').onclick=()=>zoomAt(stats.zoom/1.35);
 document.getElementById('mapReset').onclick=()=>{stats.zoom=1;stats.panX=0;stats.panY=0;transform()};
}

render();
</script></body></html>
